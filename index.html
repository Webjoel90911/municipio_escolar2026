<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón Cortesino - Municipio Escolar 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --verde-institucional: #0A5C36;
      --verde-claro: #148248;
      --aurora-top: #022013;
      --aurora-mid: #09472A;
      --aurora-bot: #02180D;
      --blanco: #FFFFFF;
      --gris-claro: #F4F6F5;
      --texto-oscuro: #222222;
      --sombra: rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--aurora-top), var(--aurora-mid), var(--aurora-bot));
      background-size: 400% 400%;
      animation: auroraGlow 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      color: var(--texto-oscuro);
    }

    @keyframes auroraGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background-color: var(--blanco);
      border-radius: 16px;
      box-shadow: 0 10px 25px var(--sombra);
      width: 100%;
      max-width: 650px;
      padding: 25px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 90px;
      height: auto;
      margin-bottom: 10px;
    }

    .header h1 {
      color: var(--verde-institucional);
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .header h2 {
      color: #555;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Grilla de Instrucciones 2x2 */
    .instructions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .instruction-card {
      background-color: var(--verde-institucional);
      color: var(--blanco);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--verde-institucional);
    }

    .form-control, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }

    .form-control:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--verde-institucional);
    }

    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 5px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .radio-option input {
      accent-color: var(--verde-institucional);
    }

    #name-field-container {
      display: none;
      margin-top: 10px;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--verde-institucional);
      color: var(--blanco);
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: var(--verde-claro);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      display: none;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    @media (max-width: 480px) {
      .instructions-grid {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="OIP.webp" alt="Logotipo Institucional" class="logo" onerror="this.style.display='none'">
      <h1>Buzón Cortesino</h1>
      <h2>I.E. Tte. Miguel Cortés del Castillo - Municipio Escolar 2026</h2>
    </div>

    <!-- Instrucciones en Grilla 2x2 -->
    <div class="instructions-grid">
      <div class="instruction-card">1. Tu voz cuenta: Exprésate libremente</div>
      <div class="instruction-card">2. Opción Anónima o Identificada</div>
      <div class="instruction-card">3. Reportes revisados con total confidencialidad</div>
      <div class="instruction-card">4. Construyamos juntos un mejor colegio</div>
    </div>

    <form id="report-form">
      <div class="form-group">
        <label>Modalidad de Envío:</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="anonimo" value="true" checked id="radio-anonimo"> Anónimo
          </label>
          <label class="radio-option">
            <input type="radio" name="anonimo" value="false" id="radio-nombre"> Con Nombre
          </label>
        </div>
      </div>

      <div class="form-group" id="name-field-container">
        <label for="nombre_estudiante">Nombre Completo y Grado/Sección:</label>
        <input type="text" id="nombre_estudiante" class="form-control" placeholder="Ej: Juan Pérez - 4to B">
      </div>

      <div class="form-group">
        <label for="tipo_reporte">Tipo de Mensaje:</label>
        <select id="tipo_reporte" required>
          <option value="" disabled selected>Selecciona una opción...</option>
          <option value="Sugerencia">Sugerencia</option>
          <option value="Queja">Queja</option>
          <option value="Reclamo">Reclamo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="mensaje">Detalle de tu Sugerencia, Queja o Reclamo:</label>
        <textarea id="mensaje" rows="5" required placeholder="Escribe aquí tu mensaje de forma respetuosa y detallada..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Enviar Mensaje</button>
    </form>

    <div id="status-message" class="status-msg"></div>
  </div>

  <!-- Firebase SDK modular desde CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Credenciales de Firebase actualizadas
    const firebaseConfig = {
      apiKey: "AIzaSyBx6WWDY7GXzYHiJKDXv_dnN7cAdFwdK34",
      authDomain: "buzon-cortesino.firebaseapp.com",
      projectId: "buzon-cortesino",
      storageBucket: "buzon-cortesino.firebasestorage.app",
      messagingSenderId: "501889093050",
      appId: "1:501889093050:web:b15e1023241d4ad40e6183"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Lógica del Formulario
    const radioAnonimo = document.getElementById('radio-anonimo');
    const radioNombre = document.getElementById('radio-nombre');
    const nameContainer = document.getElementById('name-field-container');
    const nameInput = document.getElementById('nombre_estudiante');
    const form = document.getElementById('report-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-message');

    radioAnonimo.addEventListener('change', () => {
      nameContainer.style.display = 'none';
      nameInput.value = '';
    });

    radioNombre.addEventListener('change', () => {
      nameContainer.style.display = 'block';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const esAnonimo = radioAnonimo.checked;
      const nombre = esAnonimo ? "Anónimo" : nameInput.value.trim();
      const tipo = document.getElementById('tipo_reporte').value;
      const mensaje = document.getElementById('mensaje').value.trim();

      if (!esAnonimo && !nombre) {
        showStatus('Por favor, ingresa tu nombre y grado/sección.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Enviando...';

      try {
        await addDoc(collection(db, "reportes"), {
          nombre: nombre,
          esAnonimo: esAnonimo,
          tipo: tipo,
          mensaje: mensaje,
          fecha: serverTimestamp(),
          estado: 'Pendiente'
        });

        showStatus('¡Tu mensaje ha sido enviado con éxito al Municipio Escolar!', 'success');
        form.reset();
        nameContainer.style.display = 'none';
      } catch (error) {
        console.error("Error al enviar el reporte: ", error);
        showStatus('Ocurrió un error al enviar tu mensaje. Inténtalo de nuevo.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Enviar Mensaje';
      }
    });

    function showStatus(message, type) {
      statusMsg.className = `status-msg ${type === 'success' ? 'status-success' : 'status-error'}`;
      statusMsg.innerText = message;
      statusMsg.style.display = 'block';
      setTimeout(() => {
        statusMsg.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
